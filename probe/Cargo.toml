[package]
name = "takara-probe"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "Step 0 throwaway: proves a NEAR contract can call OutLayer with a pinned wasm hash and receive the result in its own callback."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
