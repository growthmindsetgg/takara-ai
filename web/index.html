<style>
:root {
  color-scheme: light;
  --paper: #FAFAF8; --surface: #FFFFFF; --sunken: #F4F4F0;
  --ink: #182026; --ink-2: #364048; --muted: #5A636B;
  --line: #E6E5DF; --line-2: #D5D4CC; --line-strong: #8C918C;
  --accent: #0B5D52; --accent-2: #4A8F84; --accent-soft: #E6F0ED; --accent-ink: #08473F;
  --warn: #8A5300; --warn-soft: #FAF0DC;
  --bad: #9E2A2E; --bad-soft: #FAEAEA;
  --seg-paid: #8C918C; --seg-reserved: #4A8F84; --seg-spendable: #0B5D52;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r-sm: 6px; --r-md: 10px; --r-lg: 14px;
  --lift: 0 1px 0 rgba(24,32,38,.03), 0 18px 40px -24px rgba(24,32,38,.28);
  --shadow-pop: 0 2px 6px rgba(24,32,38,.06), 0 24px 48px -16px rgba(24,32,38,.28);
  --ease: cubic-bezier(.2,.7,.2,1); --ease-out: cubic-bezier(.4,0,1,1);
  --side: 240px; --pad: 32px;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: 24px; }
body { margin: 0; min-height: 100dvh; background: var(--paper); color: var(--ink); font: 400 15px/22px var(--sans); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
a { color: var(--accent); text-underline-offset: 3px; text-decoration-thickness: 1px; transition: color .16s var(--ease); }
a:hover { color: var(--accent-ink); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; text-wrap: pretty; }
ul, ol, dl, dd { margin: 0; padding: 0; }
ul, ol { list-style: none; }
button, input { font: inherit; color: inherit; }
button, a, summary, input { touch-action: manipulation; }
.vh { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.mono { font-family: var(--mono); }
.num, .money, .tnum { font-variant-numeric: tabular-nums; }
.money .sym { font-size: .8em; font-weight: 500; color: var(--muted); }
code { font-family: var(--mono); font-size: .92em; }
svg { flex: none; }
.skip { position: fixed; left: 12px; top: 12px; z-index: 100; padding: 10px 14px; background: var(--ink); color: #fff; border-radius: var(--r-md); transform: translateY(-200%); }
.skip:focus { transform: none; color: #fff; }

/* ---------- shell ---------- */
.side { position: fixed; inset: 0 auto 0 0; width: var(--side); background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; z-index: 20; }
.brand { height: 64px; display: flex; align-items: center; gap: 10px; padding: 0 20px; font-weight: 600; font-size: 16px; letter-spacing: -.01em; color: var(--ink); text-decoration: none; }
.acctrow { display: flex; align-items: center; gap: 2px; padding: 0 8px 12px 20px; margin-bottom: 8px; border-bottom: 1px solid var(--line); min-height: 44px; }
.acctrow .mono { font-size: 12px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; }
.navlist { display: grid; gap: 2px; padding: 4px 10px; }
.nv { position: relative; display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border-radius: 8px; color: var(--ink-2); text-decoration: none; font-weight: 500; font-size: 14px; transition: background-color .16s var(--ease), color .16s var(--ease); }
.nv:hover { background: var(--sunken); color: var(--ink); }
.nv[aria-current="page"] { background: var(--accent-soft); color: var(--accent-ink); }
.nv[aria-current="page"]::before { content: ""; position: absolute; left: -10px; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent); }
.nv-l { flex: 1; min-width: 0; }
.nv-b { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); font: 600 12px/20px var(--sans); text-align: center; font-variant-numeric: tabular-nums; }
.nv-b[hidden] { display: none; }
.side-foot { margin-top: auto; padding: 16px 20px 20px; border-top: 1px solid var(--line); display: grid; gap: 12px; }
.envtags { display: flex; flex-wrap: wrap; gap: 6px; }
.etag { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 4px; font: 500 12px/1 var(--sans); background: var(--warn-soft); color: var(--warn); white-space: nowrap; }
.etag.fx { background: var(--sunken); color: var(--ink-2); }
.etag.short { display: none; }
.footlinks { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; }
.content { margin-left: var(--side); min-width: 0; }
main { display: block; max-width: calc(1120px + 2 * var(--pad)); margin: 0 auto; padding: 28px var(--pad) 64px; }
.topbar, .tabbar { display: none; }

/* banners */
.demo { background: var(--warn-soft); border-bottom: 1px solid rgba(138,83,0,.3); color: var(--ink); font-size: 14px; line-height: 20px; }
.demo-in { max-width: calc(1120px + 2 * var(--pad)); margin: 0 auto; padding: 10px var(--pad); display: flex; align-items: flex-start; gap: 12px; }
.demo-in p { max-width: 80ch; flex: 1; padding-top: 2px; }
.demo-in p a { color: var(--warn); font-weight: 500; margin-left: 4px; white-space: nowrap; }
.statebar { max-width: calc(1120px + 2 * var(--pad)); margin: 0 auto; padding: 16px var(--pad) 0; }
.statebar p { padding: 12px 16px; border-radius: var(--r-md); font-weight: 500; }
.statebar .t-bad { background: var(--bad-soft); color: var(--bad); border: 1px solid #F1D2D3; }
.statebar .t-warn { background: var(--warn-soft); color: var(--warn); border: 1px solid #F0DDB8; }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 8px 16px; border-radius: var(--r-md); border: 1px solid transparent; font: 500 14.5px/1.2 var(--sans); cursor: pointer; text-decoration: none; transition: background-color .16s var(--ease), border-color .16s var(--ease), color .16s var(--ease), transform .12s var(--ease); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn-primary { background: var(--ink); color: #fff; }
.btn-primary:hover:not(:disabled) { background: #26323A; color: #fff; }
.btn-secondary { background: var(--surface); color: var(--ink); border-color: var(--line-strong); }
.btn-secondary:hover:not(:disabled) { border-color: var(--ink-2); background: var(--sunken); color: var(--ink); }
.btn-ghost { background: transparent; color: var(--ink-2); padding: 8px 12px; }
.btn-ghost:hover:not(:disabled) { background: var(--sunken); color: var(--ink); }
.btn:disabled { cursor: not-allowed; opacity: .55; }
.iconbtn { display: inline-grid; place-items: center; width: 44px; height: 44px; border: 0; border-radius: var(--r-md); background: transparent; color: var(--ink-2); cursor: pointer; transition: background-color .16s var(--ease), color .16s var(--ease); }
.iconbtn:hover { background: var(--sunken); color: var(--ink); }
.copy { display: inline-grid; place-items: center; width: 44px; height: 44px; margin: -12px -10px -12px -8px; border: 0; background: transparent; color: var(--muted); cursor: pointer; border-radius: 8px; vertical-align: middle; transition: color .16s var(--ease), background-color .16s var(--ease); }
.copy:hover { color: var(--ink); background: var(--sunken); }
.spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgba(255,255,255,.35); border-top-color: #fff; }
@media (prefers-reduced-motion: no-preference) { .spin { animation: rot .8s linear infinite; } }
@keyframes rot { to { transform: rotate(360deg); } }

/* ---------- page header ---------- */
.ph { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 12px 24px; margin-bottom: 24px; }
.ph-t { min-width: 0; flex: 1 1 320px; }
[tabindex="-1"]:focus-visible { outline-offset: 4px; border-radius: 4px; }
.ph h1 { width: fit-content; max-width: 100%; font-size: 24px; line-height: 30px; font-weight: 600; letter-spacing: -.015em; display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; }
.ph-d { margin-top: 4px; font-size: 14px; line-height: 20px; color: var(--muted); max-width: 75ch; }
.ph-r { display: flex; align-items: center; gap: 4px; color: var(--muted); font-size: 13px; }
.ph-r .btn-ghost { min-height: 36px; font-size: 13.5px; padding: 6px 10px; }

/* ---------- layout ---------- */
.g12 { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 24px; }
.s7 { grid-column: span 7; } .s5 { grid-column: span 5; } .s12 { grid-column: 1 / -1; }
.stack { display: grid; gap: 24px; }
.stack > *, .g12 > * { min-width: 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); min-width: 0; }
.panel-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px 16px; flex-wrap: wrap; padding: 20px 24px 0; }
.panel-h h2, .h2 { font-size: 17px; line-height: 24px; font-weight: 600; letter-spacing: -.01em; }
.panel-b { padding: 16px 24px 20px; }
.more { font-size: 14px; font-weight: 500; text-decoration: none; white-space: nowrap; }
.more:hover { text-decoration: underline; }
.chev { display: inline-block; margin-left: 4px; }
.muted { color: var(--muted); }
.sm { font-size: 13px; line-height: 18px; }
.empty { padding: 20px 24px 24px; color: var(--ink-2); max-width: 65ch; }
.empty h2, .empty h3 { font-size: 17px; line-height: 24px; color: var(--ink); margin-bottom: 4px; }
.empty a { display: inline-block; margin-top: 10px; font-weight: 500; }

/* ---------- pills, badges, tags ---------- */
.pill, .badge { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 6px; border: 1px solid; font: 500 12.5px/1 var(--sans); white-space: nowrap; flex: none; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.t-quiet::before { display: none; }
.t-bad { background: var(--bad-soft); color: var(--bad); border-color: #F1D2D3; }
.t-warn { background: var(--warn-soft); color: var(--warn); border-color: #F0DDB8; }
.t-neutral { background: var(--sunken); color: var(--ink-2); border-color: var(--line); }
.t-accent { background: var(--accent-soft); color: var(--accent-ink); border-color: #CFE2DC; }
.t-quiet { background: var(--surface); color: var(--muted); border-color: var(--line-2); }
.badges { display: flex; flex-wrap: wrap; gap: 4px; }
.tag { display: inline-block; flex: none; font: 500 11.5px/16px var(--sans); background: var(--sunken); color: var(--muted); border-radius: 4px; padding: 1px 6px; white-space: nowrap; }
.tag.warn { background: var(--warn-soft); color: var(--warn); }
.tag.acc { background: var(--accent-soft); color: var(--accent-ink); }
.tag.bad { background: var(--bad-soft); color: var(--bad); }
.tag.ink { background: var(--sunken); color: var(--ink-2); }
.rotag { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 8px; border-radius: 4px; background: var(--sunken); color: var(--ink-2); font: 500 12.5px/1 var(--sans); letter-spacing: 0; }

/* ---------- hero ---------- */
.hero { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); box-shadow: var(--lift); }
.hero-l { grid-column: span 7; padding: 28px; min-width: 0; min-height: 300px; }
.hero-r { grid-column: span 5; border-left: 1px solid var(--line); min-width: 0; display: grid; grid-template-rows: repeat(3, auto); }
.hl-label { font-size: 14px; line-height: 20px; font-weight: 500; color: var(--ink-2); }
.hl-val { margin-top: 6px; font-size: 48px; line-height: 52px; font-weight: 600; letter-spacing: -.025em; color: var(--accent-ink); font-variant-numeric: tabular-nums; }
.hl-val.neg { color: var(--bad); }
.hl-val .u { font-size: 20px; font-weight: 500; letter-spacing: 0; color: var(--muted); }
.hl-sub { margin-top: 4px; font-size: 15px; color: var(--muted); }
.bar { display: flex; gap: 2px; height: 14px; margin-top: 20px; }
.bar.over { outline: 2px solid var(--bad); outline-offset: 2px; border-radius: var(--r-sm); }
.seg { min-width: 4px; height: 100%; transform-origin: left center; }
.seg:first-child { border-radius: var(--r-sm) 0 0 var(--r-sm); }
.seg:last-child { border-radius: 0 var(--r-sm) var(--r-sm) 0; }
.seg:only-child { border-radius: var(--r-sm); }
.seg.paid { background: var(--seg-paid); } .seg.res { background: var(--seg-reserved); } .seg.spend { background: var(--seg-spendable); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 20px; margin-top: 12px; font-size: 13px; line-height: 18px; }
.legend li { display: inline-flex; align-items: center; gap: 6px; }
.legend .sw { width: 10px; height: 10px; border-radius: 2px; }
.legend .lv { font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
.legend .ll { color: var(--muted); }
@media (prefers-reduced-motion: no-preference) {
  .bar.grow .seg { animation: grow .6s var(--ease) both; }
  .bar.grow .seg:nth-child(2) { animation-delay: 60ms; }
  .bar.grow .seg:nth-child(3) { animation-delay: 120ms; }
  .legend.grow .lv { animation: fade .3s var(--ease) .2s both; }
}
@keyframes grow { from { transform: scaleX(0); } to { transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
details > summary { cursor: pointer; list-style: none; }
details > summary::-webkit-details-marker { display: none; }
.disc > summary { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; font-size: 13px; font-weight: 500; color: var(--accent); border-radius: 4px; }
.disc > summary:hover { color: var(--accent-ink); }
.disc > summary svg { transition: transform 90ms var(--ease); }
.disc[open] > summary svg { transform: rotate(90deg); }
.calc { margin-top: 16px; }
.calc dl { margin-top: 8px; display: grid; gap: 10px; }
.calc dl > div { display: grid; gap: 2px; padding-top: 10px; border-top: 1px solid var(--line); }
.calc dt { font-size: 13px; font-weight: 600; display: flex; justify-content: space-between; gap: 12px; }
.calc dd { font-size: 13px; line-height: 18px; color: var(--ink-2); }
.calc .f { font: 12px/17px var(--mono); color: var(--muted); overflow-wrap: anywhere; }
.calc .close { margin-top: 12px; font-size: 13px; color: var(--muted); }

/* metric rows */
.metric { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-content: start; column-gap: 12px; padding: 20px 24px; color: inherit; text-decoration: none; border-top: 1px solid var(--line); min-width: 0; }
.metric:first-child { border-top: 0; }
.metric > * { grid-column: 1; min-width: 0; }
.metric .m-l { font-size: 13px; line-height: 18px; font-weight: 500; color: var(--ink-2); }
.metric .m-v { margin-top: 2px; font-size: 32px; line-height: 38px; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.metric .m-v.smv { font-size: 20px; line-height: 28px; letter-spacing: -.01em; }
.metric .m-v .u { font-size: 15px; font-weight: 500; letter-spacing: 0; color: var(--muted); }
.metric .m-c { font-size: 13px; line-height: 18px; color: var(--muted); margin-top: 2px; }
.metric .m-c.warn { color: var(--warn); } .metric .m-c.bad { color: var(--bad); }
.metric .m-go { grid-column: 2; grid-row: 1 / span 4; align-self: center; color: var(--muted); display: inline-flex; align-items: center; font-size: 14px; font-weight: 500; }
.metric .m-go a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 4px; }
a.metric { transition: background-color .16s var(--ease); }
a.metric:hover { background: var(--sunken); color: inherit; }
a.metric:last-child { border-radius: 0 0 var(--r-lg) 0; }
a.metric:focus-visible { outline-offset: -2px; }

/* ---------- approval card ---------- */
.queue { display: grid; gap: 12px; max-width: 760px; }
.acard { position: relative; container-type: inline-size; background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--line-2); border-radius: var(--r-md); padding: 20px; min-width: 0; }
.acard.tone-bad { border-left-color: var(--bad); } .acard.tone-warn { border-left-color: var(--warn); }
.ac-1 { display: flex; align-items: center; gap: 8px; min-width: 0; }
.ac-name { font-size: 17px; line-height: 24px; font-weight: 600; letter-spacing: -.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.ac-amt { margin-left: auto; padding-left: 12px; font-size: 17px; font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
.ac-head { margin-top: 6px; color: var(--ink-2); }
.cmp { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 8px; align-items: center; margin-top: 14px; }
.box { background: var(--sunken); border: 1px solid transparent; border-radius: var(--r-sm); padding: 12px 14px; min-width: 0; align-self: stretch; }
.box.prop { border-color: #E3B7B9; }
.box-t { font-size: 12.5px; line-height: 18px; font-weight: 500; color: var(--ink-2); }
.box.prop .box-t { color: var(--bad); }
.box-v { margin-top: 4px; font: 14px/20px var(--mono); overflow-wrap: anywhere; color: var(--ink); }
.box-c { font-size: 12.5px; color: var(--muted); }
.neq { font-size: 16px; color: var(--muted); }
@container (max-width: 560px) { .cmp { grid-template-columns: minmax(0, 1fr); } .neq { display: none; } }
@media (max-width: 559px) { .cmp { grid-template-columns: minmax(0, 1fr); } .neq { display: none; } }
.facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 16px; margin-top: 14px; }
.facts dt { font-size: 13px; line-height: 20px; color: var(--muted); }
.facts dd { font-size: 14px; line-height: 20px; min-width: 0; overflow-wrap: anywhere; }
.facts .mono { font-size: 13px; }
.ac-act { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 4px 24px; margin-top: 12px; }
.ac-act > a { display: inline-flex; align-items: center; min-height: 32px; font-weight: 500; font-size: 14px; }
.ac-act details { flex: 1 1 260px; }
.ac-act details p { margin-top: 4px; font-size: 13.5px; line-height: 20px; color: var(--ink-2); max-width: 65ch; }
.acard.compact { padding: 14px 16px; display: block; color: inherit; text-decoration: none; transition: background-color .16s var(--ease); }
.acard.compact:hover { background: #FCFCFA; color: inherit; }
.acard.compact .ac-name { font-size: 15px; line-height: 22px; }
.acard.compact .ac-amt { font-size: 15px; }
.acard.compact .ac-head { font-size: 14px; line-height: 20px; margin-top: 4px; }
.acard.compact .ac-meta { margin-top: 4px; font-size: 13px; line-height: 18px; color: var(--muted); }
.attlist { display: grid; gap: 10px; padding: 16px 24px 24px; }
.qsec { margin-top: 32px; }
.qsec:first-child { margin-top: 0; }
.qsec h2 { font-size: 17px; line-height: 24px; margin-bottom: 4px; }
.qsec .qd { font-size: 14px; color: var(--muted); margin-bottom: 4px; }
.qsec .queue { margin-top: 12px; }

/* ---------- coming up ---------- */
.up-sum { padding: 8px 24px 4px; font-size: 15px; }
.up-sum .od { color: var(--bad); font-weight: 600; }
.uplist { padding: 8px 12px 4px; }
.uprow { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; grid-template-areas: "d n a" "d n p"; column-gap: 12px; row-gap: 4px; align-items: center; padding: 10px 12px; border-radius: var(--r-md); color: inherit; text-decoration: none; transition: background-color .16s var(--ease); }
.uprow:hover { background: var(--sunken); color: inherit; }
.uprow:focus-visible { outline-offset: -2px; }
.dblk { grid-area: d; text-align: center; line-height: 1.1; }
.dblk .m { display: block; font-size: 12px; color: var(--muted); }
.dblk .d { display: block; font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
.dblk .y { display: block; font-size: 11px; color: var(--muted); }
.up-n { grid-area: n; min-width: 0; }
.up-n .nm { display: block; font-weight: 500; overflow-wrap: break-word; }
.up-n .nm .mono { font-size: 13.5px; }
.up-n .rc { display: block; font-size: 13px; color: var(--muted); line-height: 18px; }
.up-a { grid-area: a; text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }

/* ---------- activity ---------- */
.actday { padding: 0 24px; }

.acts { display: grid; }
.act { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }

.act-ic { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; }
.k-caught .act-ic { background: var(--bad-soft); color: var(--bad); }
.k-held .act-ic { background: var(--warn-soft); color: var(--warn); }
.k-money .act-ic { background: var(--accent-soft); color: var(--accent-ink); }

.act-s { font-size: 15px; line-height: 22px; overflow-wrap: anywhere; }

.act-m { margin-top: 2px; font-size: 13px; line-height: 18px; color: var(--muted); }

.actwrap { padding-bottom: 12px; }
.filters { display: flex; gap: 2px; padding: 3px; margin-bottom: 20px; border: 1px solid var(--line-strong); border-radius: var(--r-md); background: var(--surface); width: max-content; max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.filters a { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 12px; border-radius: 7px; color: var(--ink-2); text-decoration: none; font-weight: 500; font-size: 14px; white-space: nowrap; transition: background-color .16s var(--ease), color .16s var(--ease); }
.filters a:hover { background: var(--sunken); color: var(--ink); }

.filters a .c { font-variant-numeric: tabular-nums; color: inherit; opacity: .8; }
.fwrap { position: relative; max-width: 100%; }
.breakdown { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 0 24px; padding: 16px 24px; border-bottom: 1px solid var(--line); }
.breakdown > div { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px dashed var(--line); }
.breakdown dt { color: var(--ink-2); font-size: 14px; }
.breakdown dd { font-weight: 600; font-variant-numeric: tabular-nums; }
.bnote { padding: 12px 24px 0; font-size: 13px; color: var(--muted); }

/* ---------- tables ---------- */
.tbl { width: 100%; table-layout: fixed; border-collapse: collapse; }
.tbl th { text-align: left; font-size: 13px; line-height: 18px; font-weight: 500; color: var(--muted); padding: 12px; border-bottom: 1px solid var(--line); background: #FCFCFA; }
.tbl th:first-child, .tbl td:first-child { padding-left: 20px; }
.tbl td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; min-width: 0; }
.tbl tbody tr:last-child td { border-bottom: 0; }
.tbl .num { text-align: right; }
.tbl thead th:first-child { border-top-left-radius: var(--r-lg); }
.tbl thead th:last-child { border-top-right-radius: var(--r-lg); }
tr.row { position: relative; height: 60px; transition: background-color .16s var(--ease); }
tr.row:hover { background: #FCFCFA; }
tr.row:focus-within { outline: 2px solid var(--accent); outline-offset: -2px; }
.stretch { color: var(--ink); text-decoration: none; }

.b-name { display: flex; align-items: center; gap: 6px; min-width: 0; }
.b-name .stretch { font-size: 15px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.b-sub { margin-top: 2px; display: flex; gap: 6px; font-size: 13px; line-height: 18px; color: var(--muted); min-width: 0; white-space: nowrap; }
.b-sub .mono { font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.b-iss-in { display: none; margin-top: 6px; }
.td-due .d1 { font-size: 14px; } .td-due .d2 { font-size: 12.5px; line-height: 16px; color: var(--muted); } .td-due .d2.od { color: var(--bad); }
.td-amt { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.td-amt .sym { font-size: 12.5px; }
.td-wait { font-size: 13.5px; color: var(--ink-2); line-height: 18px; }
.c-bill { width: auto; } .c-due { width: 112px; } .c-amt { width: 112px; } .c-st { width: 140px; } .c-iss { width: 176px; } .c-wait { width: 136px; }
.cards { display: none; }
.crd { position: relative; padding: 14px 16px; border-top: 1px solid var(--line); }
.crd:first-child { border-top: 0; }
.crd:focus-within { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: var(--r-md); }
.crd-1, .crd-2 { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-width: 0; }
.crd-1 .nm { display: flex; align-items: center; gap: 6px; min-width: 0; }
.crd-1 .stretch { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.crd-1 .money { font-weight: 600; white-space: nowrap; }
.crd-2 { margin-top: 4px; font-size: 13px; color: var(--muted); }
.crd-2 > span:first-child { min-width: 0; }
.crd-3 { margin-top: 8px; }
.sumstrip { font-size: 15px; margin-bottom: 16px; color: var(--ink-2); }
.sumstrip b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }

/* vendors */
.c-vn { width: auto; } .c-pay { width: 24%; } .c-cnt { width: 56px; } .c-open { width: 104px; } .c-paid { width: 104px; } .c-vst { width: 176px; }
.v-pay-in { display: none; }
.dest { font: 13px/18px var(--mono); color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chain { font-size: 12px; color: var(--muted); }
.secgap { margin-top: 32px; }
.sech { font-size: 17px; line-height: 24px; font-weight: 600; margin-bottom: 12px; }

/* ledger */
.c-lb { width: 15%; } .c-ls { width: 120px; } .c-lp { width: 120px; } .c-li { width: auto; } .c-lh { width: 190px; } .c-la { width: 130px; }
.sumdl { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.sumdl > div { padding: 14px 24px; border-top: 1px solid var(--line); min-width: 0; }
.sumdl > div:nth-child(-n+2) { border-top: 0; }
.sumdl > div:nth-child(odd) { border-right: 1px solid var(--line); }
.sumdl dt { font-size: 13px; color: var(--muted); }
.sumdl dd { margin-top: 2px; display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; min-width: 0; overflow-wrap: anywhere; }
.sumdl .mono { font-size: 13.5px; }
.vis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.vis > div { padding: 16px 20px; border-radius: var(--r-md); }
.vis .see { background: var(--surface); border: 1px solid var(--line); }
.vis .seal { background: var(--sunken); border: 1px solid var(--line); }
.vis h3 { font-size: 15px; font-weight: 600; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
.vis p { color: var(--ink-2); font-size: 14px; }
.changes li { padding: 12px 24px; border-top: 1px solid var(--line); font-size: 14px; color: var(--ink-2); overflow-wrap: anywhere; }
.changes li:first-child { border-top: 0; }
.footnote { margin-top: 24px; font-size: 13.5px; color: var(--muted); max-width: 80ch; }
.hashc { display: inline-flex; align-items: center; gap: 2px; font: 12.5px/18px var(--mono); color: var(--ink-2); white-space: nowrap; }
.sm-link { font-size: 13px; display: inline-block; margin-top: 2px; position: relative; z-index: 1; }

/* ---------- policy ---------- */
.field + .field { margin-top: 24px; }
.field label { display: block; font-size: 15px; font-weight: 500; }
.f-desc { margin-top: 2px; font-size: 13.5px; line-height: 20px; color: var(--muted); }
.inp { display: flex; align-items: stretch; margin-top: 8px; max-width: 320px; border: 1px solid var(--line-strong); border-radius: var(--r-md); background: var(--surface); transition: border-color .16s var(--ease), box-shadow .16s var(--ease); }
.inp:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.inp.invalid { border-color: var(--bad); }
.inp input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 10px 12px; font-size: 16px; font-weight: 500; font-variant-numeric: tabular-nums; outline: none; border-radius: var(--r-md) 0 0 var(--r-md); }
.inp .u { display: flex; align-items: center; padding: 0 12px; color: var(--muted); font-size: 14px; border-left: 1px solid var(--line); background: #FCFCFA; border-radius: 0 var(--r-md) var(--r-md) 0; }
.f-cur { margin-top: 6px; font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.f-err { margin-top: 6px; font-size: 13.5px; color: var(--bad); font-weight: 500; }

.callout { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 10px; padding: 12px 14px; border-radius: var(--r-md); background: var(--sunken); font-size: 14px; color: var(--ink-2); margin-top: 28px; }
.callout b { color: var(--ink); font-weight: 600; }
.formfoot { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 16px; }
.formnote { margin-top: 10px; font-size: 13px; color: var(--muted); }
.who dl { display: grid; gap: 0; }
.who dl > div { padding: 12px 0; border-top: 1px solid var(--line); min-width: 0; }
.who dl > div:first-child { border-top: 0; padding-top: 0; }
.who dt { font-size: 13px; color: var(--muted); }
.who dd { margin-top: 2px; overflow-wrap: anywhere; display: flex; align-items: center; flex-wrap: wrap; gap: 2px 8px; }
.who .mono { font-size: 13.5px; }
.who p { margin-top: 12px; font-size: 14px; color: var(--ink-2); }

/* ---------- ask ---------- */
.ask { max-width: 760px; }
.chatlog { min-height: 50vh; max-height: 64vh; overflow-y: auto; overscroll-behavior: contain; padding: 20px; display: flex; flex-direction: column; gap: 12px; background: #FCFCFA; border: 1px solid var(--line); border-radius: var(--r-lg) var(--r-lg) 0 0; }
.msg { max-width: 88%; padding: 10px 14px; border-radius: 12px; font-size: 15px; line-height: 22px; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.q { align-self: flex-end; background: var(--ink); color: #fff; border-bottom-right-radius: 4px; }
.msg.a { align-self: flex-start; background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
.msg.pending { color: var(--muted); }
.msg.err { border-color: #F1D2D3; background: var(--bad-soft); color: var(--bad); }
.msg abbr { text-decoration: underline dotted; text-underline-offset: 3px; cursor: help; }
.msg .src { display: block; margin-top: 6px; font-weight: 500; }
.msg code { background: var(--sunken); padding: 0 4px; border-radius: 4px; }
.chat-hello { color: var(--ink-2); font-size: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.chip { height: 32px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface); color: var(--ink-2); font-size: 13.5px; cursor: pointer; transition: border-color .16s var(--ease), color .16s var(--ease), background-color .16s var(--ease); }
.chip:hover { border-color: var(--accent); color: var(--accent-ink); background: var(--accent-soft); }
.chatform { position: sticky; bottom: 0; display: flex; gap: 8px; padding: 12px; background: var(--surface); border: 1px solid var(--line); border-top: 0; border-radius: 0 0 var(--r-lg) var(--r-lg); }
.chatform input { flex: 1; min-width: 0; border: 1px solid var(--line-strong); border-radius: var(--r-md); padding: 9px 12px; font-size: 16px; background: var(--surface); outline: none; transition: border-color .16s var(--ease), box-shadow .16s var(--ease); }
.chatform input:focus-visible { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

/* ---------- states ---------- */
.sk { display: block; background: var(--sunken); border-radius: 4px; }
@media (prefers-reduced-motion: no-preference) { .sk { background: linear-gradient(90deg, var(--sunken) 0%, #ECECE6 50%, var(--sunken) 100%); background-size: 200% 100%; animation: shimmer 1.4s linear infinite; } }
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }
.skrows { padding: 8px 24px 16px; }
.skrow { display: grid; align-content: center; gap: 8px; border-top: 1px solid var(--line); overflow: hidden; }
.skrow:first-child { border-top: 0; }
.errblk { margin: 16px 24px; padding: 16px; border-radius: var(--r-md); background: var(--bad-soft); }
.errblk.flush { margin: 0; }
.errblk h3, .errblk .et { font-size: 15px; font-weight: 600; color: var(--bad); }
.errblk p { margin-top: 4px; font-size: 14px; color: var(--ink-2); overflow-wrap: anywhere; }
.errblk .btn { margin-top: 12px; }

/* ---------- dialogs & drawers ---------- */
dialog { border: 0; padding: 0; color: var(--ink); background: var(--surface); overscroll-behavior: contain; }
dialog::backdrop { background: rgba(24,32,38,.38); }
.drawer { margin: 0 0 0 auto; width: min(520px, 100vw); max-width: 100vw; height: 100dvh; max-height: 100dvh; border-left: 1px solid var(--line); box-shadow: var(--shadow-pop); }
.dr-in { position: relative; height: 100%; display: flex; flex-direction: column; }
.dr-top { position: absolute; top: 10px; right: 10px; z-index: 2; background: var(--surface); border-radius: var(--r-md); }
.dr-body { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 22px 28px 32px; }
.dr-h { padding-right: 8px; }
.dr-h h2 { font-size: 20px; line-height: 28px; font-weight: 600; letter-spacing: -.01em; padding-right: 48px; overflow-wrap: anywhere; }
.dr-h .dr-tags { margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.dr-amt { margin-top: 10px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.dr-amt .money { font-size: 24px; line-height: 30px; font-weight: 600; letter-spacing: -.015em; }
.dr-sec { margin-top: 28px; }
.dr-sec > h3 { font-size: 13px; font-weight: 600; color: var(--ink-2); margin-bottom: 10px; }
.tl { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; }
.tl li { position: relative; padding-top: 22px; font-size: 13.5px; font-weight: 500; color: var(--muted); }
.tl li::before { content: ""; position: absolute; top: 0; left: 0; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line-2); background: var(--surface); z-index: 1; }
.tl li::after { content: ""; position: absolute; top: 6px; left: 14px; right: 0; height: 2px; background: var(--line-2); }
.tl li:last-child::after { display: none; }
.tl li.done { color: var(--ink); } .tl li.done::before { background: var(--accent); border-color: var(--accent); } .tl li.done::after { background: var(--accent); }
.tl li.now { color: var(--ink); } .tl li.now::before { border-color: var(--accent); }
.tl-note { margin-top: 10px; font-size: 14px; color: var(--ink-2); }
.callo { padding: 12px 14px; border-radius: var(--r-md); font-size: 14px; line-height: 20px; display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 10px; overflow-wrap: anywhere; }
.callo + .callo { margin-top: 8px; }
.callo.t-bad { background: var(--bad-soft); color: var(--ink); border: 1px solid #F1D2D3; }
.callo.t-warn { background: var(--warn-soft); color: var(--ink); border: 1px solid #F0DDB8; }
.callo.t-bad svg { color: var(--bad); margin-top: 2px; } .callo.t-warn svg { color: var(--warn); margin-top: 2px; }
.callo b { font-weight: 600; }
.ddl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 8px 20px; font-size: 14px; }
.ddl dt { color: var(--muted); font-size: 13.5px; }
.ddl dd { min-width: 0; overflow-wrap: anywhere; display: flex; align-items: center; flex-wrap: wrap; gap: 2px 8px; }
.ddl .mono { font-size: 13px; }
.drawer .acts .act:first-child { border-top: 0; }
.proof { margin-top: 28px; border-top: 1px solid var(--line); padding-top: 12px; }
.proof .ddl { margin-top: 10px; }
.note-box { margin-top: 24px; padding: 12px 14px; border-radius: var(--r-md); background: var(--sunken); font-size: 13.5px; color: var(--ink-2); }
.vbills li { padding: 10px 0; border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.vbills li:first-child { border-top: 0; }
.vbills a { font-weight: 500; }
.vbills .r { display: flex; gap: 10px; align-items: center; white-space: nowrap; }
.modal { width: min(560px, calc(100vw - 32px)); max-height: calc(100dvh - 48px); border-radius: var(--r-lg); box-shadow: var(--shadow-pop); }
.modal-in { padding: 24px; }
.modal h2 { font-size: 20px; line-height: 28px; font-weight: 600; }
.steps { display: flex; flex-wrap: wrap; gap: 6px 4px; margin-top: 14px; font-size: 13px; color: var(--muted); align-items: center; }
.steps li { display: inline-flex; align-items: center; gap: 6px; }
.steps li .n { width: 20px; height: 20px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 12px; font-weight: 600; background: var(--sunken); color: var(--ink-2); }
.steps li.now { color: var(--ink); font-weight: 500; } .steps li.now .n { background: var(--accent); color: #fff; }
.steps .sep { color: var(--line-strong); margin: 0 4px; }
.difft { width: 100%; border-collapse: collapse; margin-top: 18px; font-size: 14px; table-layout: fixed; }
.difft th { text-align: left; font-size: 13px; font-weight: 500; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line); }
.difft td { padding: 10px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; vertical-align: top; }
.difft td.pv { font-weight: 600; }
.difft th:first-child, .difft td:first-child { padding-left: 0; width: 44%; }
.dmeta { margin-top: 14px; display: grid; gap: 4px; font-size: 13.5px; color: var(--ink-2); }
.dmeta .mono { font-size: 12.5px; }
.raw { margin-top: 14px; }
.raw pre { margin: 8px 0 0; background: var(--sunken); border-radius: var(--r-md); padding: 12px 14px; font: 12.5px/1.6 var(--mono); overflow: auto; max-height: 30vh; white-space: pre-wrap; overflow-wrap: anywhere; }
.dfoot { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; margin-top: 20px; }
.dfoot-note { margin-top: 10px; font-size: 13px; color: var(--muted); text-align: right; }
.dalert { margin-top: 14px; padding: 10px 12px; border-radius: var(--r-md); background: var(--bad-soft); color: var(--bad); font-weight: 500; font-size: 14px; }
.nothing { margin-top: 18px; padding: 14px; border-radius: var(--r-md); background: var(--sunken); color: var(--ink-2); }
.sheet { margin: auto 0 0; width: 100vw; max-width: 100vw; border-radius: var(--r-lg) var(--r-lg) 0 0; padding-bottom: env(safe-area-inset-bottom); box-shadow: var(--shadow-pop); }
.sheet-in { padding: 8px 8px 12px; }
.sheet-h { display: flex; align-items: center; justify-content: space-between; padding: 0 8px 0 12px; }
.sheet-h h2 { font-size: 15px; font-weight: 600; }
.sheet a.si { display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 12px; border-radius: var(--r-md); color: var(--ink); text-decoration: none; font-weight: 500; }
.sheet a.si:hover { background: var(--sunken); }
.sheet a.si[aria-current="page"] { background: var(--accent-soft); color: var(--accent-ink); }
.sheet hr { border: 0; border-top: 1px solid var(--line); margin: 8px 4px; }
.sheet .acctrow { border: 0; padding: 4px 4px 0 12px; margin: 0; }
@media (prefers-reduced-motion: no-preference) {
  .drawer[open] { animation: drIn .24s var(--ease); }
  .modal[open] { animation: mdIn .24s var(--ease); }
  .sheet[open] { animation: shIn .24s var(--ease); }
}
@keyframes drIn { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: none; } }
@keyframes mdIn { from { opacity: 0; transform: translateY(8px) scale(.985); } to { opacity: 1; transform: none; } }
@keyframes shIn { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }

/* toasts */
.toasts { position: fixed; right: 24px; bottom: 24px; z-index: 60; display: grid; gap: 8px; justify-items: end; pointer-events: none; }
.toast { pointer-events: auto; display: flex; align-items: center; gap: 12px; max-width: 400px; padding: 12px 8px 12px 16px; background: var(--ink); color: #fff; font-size: 14px; border-radius: var(--r-md); box-shadow: var(--shadow-pop); }
.toast a { color: #BFE3DA; text-decoration: underline; }
.toast a:hover { color: #fff; }
.toast button { width: 32px; height: 32px; display: grid; place-items: center; border: 0; background: transparent; color: #fff; border-radius: 6px; cursor: pointer; flex: none; }
.toast button:hover { background: rgba(255,255,255,.12); }
@media (prefers-reduced-motion: no-preference) { .toast { animation: mdIn .24s var(--ease); } }

/* ---------- responsive ---------- */
@media (max-width: 1279px) {
  :root { --side: 224px; }

const VSTAT = [["Payout change frozen", "bad"], ["Cooling off", "warn"], ["Change rejected", "neutral"], ["New, awaiting signer", "warn"], ["Provisional", "warn"], ["Registered", "accent"]];
function vendorGroups(m) {
  const g = new Map();
  for (const b of m.bills) { if (!g.has(b.vid)) g.set(b.vid, []); g.get(b.vid).push(b); }
  return [...g.entries()].map(([vid, bills]) => {
    const reg = [...bills].filter((b) => !b.c.destination_mismatch).sort((a, b) => b.id - a.id)[0] || bills[bills.length - 1];
    const has = (fn) => bills.some(fn);
    let st = 5;
    if (has((b) => b.c.vendor_change === "suspended_destination_mismatch")) st = 0;
    else if (has((b) => b.c.vendor_change === "approved_cooling_off")) st = 1;
    else if (has((b) => b.c.vendor_change === "rejected")) st = 2;
    else if (reg.kind === "new" && has((b) => b.state === "claimed")) st = 3;
    else if (has((b) => b.flags.prov)) st = 4;
    const sum = (fn) => bills.filter(fn).reduce((a, b) => a + b.amount, 0);
    return { vid, bills, reg, kind: reg.kind, name: reg, st, status: VSTAT[st], open: sum((b) => b.state === "claimed" || b.state === "accepted"), paid: sum((b) => b.state === "settled"), changeBill: bills.find((b) => b.proposed) };
  });
}

let SECTIONS = [];
function sec(id, deps, opt, render, skel, label) {

function fillSection(s) {

  const err = s.deps.find((k) => S[k].status === "error");

  if (err) { el.removeAttribute("aria-busy"); el.innerHTML = part(errBlock(err)); return; }
  if (loading) { el.setAttribute("aria-busy", "true"); el.innerHTML = part(s.skel ? s.skel() : skRows()) + `<span class="vh">${esc(s.label)}</span>`; return; }

}

  } else sentence = "Nothing due in the next 30 days.";

const REASON_LABEL = Object.fromEntries(Object.entries(REASONS).map(([k, v]) => [k, v.label]));
function fmtAnswer(text) {
  let s = esc(text);
  s = s.replace(/`([^`]+)`/g, (mm, code) => (REASON_LABEL[code] ? `<abbr title="${code}">${esc(REASON_LABEL[code])}</abbr>` : `<code translate="no">${code}</code>`));
  s = s.replace(/\d{4}-\d{2}-\d{2}T[\d:.]+Z/g, (iso) => { const t = Date.parse(iso); return Number.isFinite(t) ? part(timeEl(t, fmtDateTime(t))) : iso; });
  const m = model();
  s = s.replace(/new:[0-9a-f]{6,}/g, (id) => { const b = m && m.bills.find((x) => x.vid === id); return b ? part(nameHTML(b)) : "New vendor"; });
  return s;
}
function paintChat() {
  const log = $("#chatlog"); if (!log) return;
  const parts = [h`<div class="msg a chat-hello">Ask about a bill, a block or a figure. Takara can’t pay, approve or change anything here.</div>`];
  for (const msg of CHAT.msgs) {
    if (msg.role === "q") parts.push(h`<div class="msg q">${msg.text}</div>`);
    else if (msg.pending) parts.push(h`<div class="msg a pending">Reading the ledger…</div>`);
    else if (msg.error) parts.push(h`<div class="msg a err">Takara couldn’t answer: ${msg.error.replace(/\.$/, "")}. Try again.</div>`);
    else { const src = (msg.data.sources || []).filter((x) => x.url); parts.push(h`<div class="msg a">${raw(fmtAnswer(msg.data.answer || ""))}${src.map((x) => h`<span class="src">${ext(x.url, "View transaction")}</span>`)}</div>`); }
  }
  if (!CHAT.msgs.length) parts.push(h`<div class="chips" role="group" aria-label="Suggested questions">${SUGGEST.map((q) => h`<button class="chip" type="button" data-act="chip" data-q="${q}">${q}</button>`)}</div>`);
  log.innerHTML = part(join(parts, ""));
  log.scrollTop = log.scrollHeight;
}
async function ask(q) {
  q = String(q).trim(); if (!q || CHAT.busy) return;
  CHAT.busy = true;
  CHAT.msgs.push({ role: "q", text: q }); const a = { role: "a", pending: true }; CHAT.msgs.push(a); paintChat();
  try { a.data = await api("/api/chat", { q }); } catch (e) { a.error = e.message; }
  a.pending = false; CHAT.busy = false; paintChat();
}

    if (!ok && !firstBad) firstBad = inp;
  }
  if (firstBad) { firstBad.focus(); return; }
  const body = Object.fromEntries(PFIELDS.map((f) => [f.k, String($(`#f-${f.k}`).value).trim()]));
  const btn = $("#pv-btn"); btn.disabled = true; btn.textContent = "Preparing preview…";
  try {
    const d = await api("/api/policy/diff", body);
    pending = { body, d };
    pdOpener = btn;
    paintPolicyDialog(d);
    pdlg.showModal(); $("#pd-title").focus();
  } catch (e) { alert.textContent = `Couldn’t prepare the preview: ${e.message}`; alert.hidden = false; }
  finally { btn.disabled = false; btn.textContent = "Preview change"; }
}
async function signPolicy() {
  if (DEMO || !pending) return; // the hosted page never calls the sign endpoint
  paintPolicyDialog(pending.d, { signing: true });
  try {
    const r = await api("/api/policy/sign", pending.body);
    if (r.ok) {
      pdlg.close();
      const to = pending.d.diff.version ? pending.d.diff.version.to : "";
      PF.edits = null;
      toast(`Policy v${to} signed and live.`, r.url ? { href: r.url, text: "View transaction" } : null);
      load("policy"); load("public"); load("report");
    } else paintPolicyDialog(pending.d, { error: plainFailure(r.failure) });
  } catch (e) { paintPolicyDialog(pending.d, { error: e.message }); }
}
pdlg.addEventListener("close", () => { if (pdOpener && pdOpener.isConnected) pdOpener.focus(); });

/* ================================================================== events */
document.addEventListener("click", async (e) => {
  const a = e.target.closest("a[href]");
  if (a) {
    const href = a.getAttribute("href");
    if (href.startsWith("#/") && cur && cur.view === "policy" && !href.startsWith("#/policy") && policyDirty()) {
      e.preventDefault(); confirmDiscard(() => { location.hash = href.slice(1); }); return;
    }
    if (/^#\/(bills|vendors)\/./.test(href)) opener = { key: a.dataset.open || null, el: a };
  }
  const t = e.target.closest("[data-act]"); if (!t) return;
  const act = t.dataset.act;
  if (act === "skip") { e.preventDefault(); main.focus(); main.scrollIntoView(); }
  else if (act === "refresh") loadAll(true);
  else if (act === "retry") load(t.dataset.k);
  else if (act === "copy") toast((await copyText(t.dataset.v, t)) ? "Copied" : "Couldn’t copy. Select the text and copy it manually.");
  else if (act === "dismiss-demo") { try { sessionStorage.setItem("takara.demoBanner", "dismissed"); } catch { /* storage blocked */ } paintDemo(); main.focus(); }
  else if (act === "close-drawer") requestCloseDrawer();
  else if (act === "more") { paintSheet(); moreSheet.showModal(); }
  else if (act === "close-more") moreSheet.close();
  else if (act === "chip") { ask(t.dataset.q); }
  else if (act === "cf-keep") confirmDlg.close();
  else if (act === "cf-discard") { confirmDlg.close(); PF.edits = null; const cb = confirmCb; confirmCb = null; if (cb) cb(); }
  else if (act === "preset") {
    const p = S.policy.data; PF.edits = null; PF.version = null; fillSection(SECTIONS.find((s) => s.id === "pform"));
    if (p) $("#f-max_auto_pay").focus();
  }
  else if (act === "pd-close") pdlg.close();
  else if (act === "pd-sign") signPolicy();
});
document.addEventListener("submit", (e) => {
  if (e.target.id === "pform") { e.preventDefault(); submitPolicy(e.target); }
  if (e.target.id === "chatform") { e.preventDefault(); const i = $("#chat-q"); const q = i.value; i.value = ""; ask(q); }
});
document.addEventListener("input", (e) => {
  const inp = e.target; if (!inp.closest || !inp.closest("#pform") || !PF.edits) return;
  PF.edits[inp.name] = inp.value;
  const p = S.policy.data;
  const tag = $(`[data-edited="${inp.name}"]`); if (tag) tag.hidden = String(inp.value).trim() === String(p[inp.name]);
  const err = $(`#e-${inp.name}`); const f = PFIELDS.find((x) => x.k === inp.name);
  if (err && !err.hidden && validField(f, inp.value)) { err.hidden = true; inp.setAttribute("aria-invalid", "false"); inp.closest(".inp").classList.remove("invalid"); }
  const rb = $('[data-act="preset"]'); if (rb) rb.disabled = !policyDirty();
});
window.addEventListener("beforeunload", (e) => { if (policyDirty()) { e.preventDefault(); e.returnValue = ""; } });

/* ================================================================== boot */
$('[data-slot="envtags-top"]').innerHTML = part(envTags("top"));
$('[data-slot="envtags-side"]').innerHTML = part(envTags("side"));
$('[data-slot="footlinks"]').innerHTML = part(h`<a href="${PRODUCT}"${DEMO ? "" : raw(' target="_blank" rel="noopener"')}>Product page${DEMO ? "" : raw('<span class="vh"> (opens in a new tab)</span>')}</a><span aria-hidden="true">·</span><a href="${GITHUB}" target="_blank" rel="noopener">GitHub<span class="vh"> (opens in a new tab)</span></a>`);
paintDemo();
onRoute();
loadAll();
</script>
</body>
</html>
