<style>
/* ---------- tokens, layer 1: primitives (raw values; components never use these directly) ---------- */
:root {
  color-scheme: light;
  --p-paper: #FAFAF8; --p-white: #FFFFFF;
  --p-stone-50: #FCFCFA; --p-stone-100: #F4F4F0; --p-stone-150: #ECECE6; --p-stone-200: #E6E5DF; --p-stone-300: #D5D4CC; --p-stone-500: #8C918C;
  --p-ink-900: #182026; --p-ink-800: #26323A; --p-ink-700: #364048; --p-ink-500: #5A636B;
  --p-green-900: #08473F; --p-green-800: #0B5D52; --p-green-500: #4A8F84; --p-green-200: #CFE2DC; --p-green-100: #E6F0ED; --p-green-50: #F2F7F5; --p-green-on-ink: #BFE3DA;
  --p-amber-800: #8A5300; --p-amber-200: #F0DDB8; --p-amber-100: #FAF0DC;
  --p-red-800: #9E2A2E; --p-red-300: #E3B7B9; --p-red-200: #F1D2D3; --p-red-100: #FAEAEA;
  /* spacing: a 4px grid */
  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 20px; --s-6: 24px; --s-8: 32px; --s-10: 40px; --s-12: 48px; --s-16: 64px;
  /* type scale (size/line-height) */
  --t-xs: 12px; --t-sm: 13px; --t-ui: 14px; --t-base: 15px; --t-md: 17px; --t-lg: 20px; --t-xl: 24px; --t-2xl: 32px; --t-hero: 48px;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r-xs: 4px; --r-sm: 6px; --r-md: 10px; --r-lg: 14px;
  --ease: cubic-bezier(.2,.7,.2,1); --ease-out: cubic-bezier(.4,0,1,1);
}
/* ---------- layer 2: semantic (what a colour means; components use these) ---------- */
:root {
  --paper: var(--p-paper); --surface: var(--p-white); --raised: var(--p-stone-50); --sunken: var(--p-stone-100);
  --ink: var(--p-ink-900); --ink-2: var(--p-ink-700); --muted: var(--p-ink-500);
  --line: var(--p-stone-200); --line-2: var(--p-stone-300); --line-strong: var(--p-stone-500);
  --accent: var(--p-green-800); --accent-2: var(--p-green-500); --accent-soft: var(--p-green-100); --accent-faint: var(--p-green-50); --accent-ink: var(--p-green-900); --accent-line: var(--p-green-200);
  --warn: var(--p-amber-800); --warn-soft: var(--p-amber-100); --warn-line: var(--p-amber-200);
  --bad: var(--p-red-800); --bad-soft: var(--p-red-100); --bad-line: var(--p-red-200); --bad-line-2: var(--p-red-300);
  --on-ink: var(--p-white); --on-ink-link: var(--p-green-on-ink);
  --lift: 0 1px 0 rgba(24,32,38,.03), 0 18px 40px -24px rgba(24,32,38,.28);
  --shadow-pop: 0 2px 6px rgba(24,32,38,.06), 0 24px 48px -16px rgba(24,32,38,.28);
}
/* ---------- layer 3: component tokens ---------- */
:root {
  --side: 240px; --pad: 32px;
  --btn-h: 40px; --btn-primary-bg: var(--ink); --btn-primary-hover: var(--p-ink-800);
  --nav-h: 36px; --panel-x: 24px;
  --seg-paid: var(--p-stone-500); --seg-reserved: var(--p-green-500); --seg-spendable: var(--p-green-800);
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: 24px; }
body { margin: 0; min-height: 100dvh; background: var(--paper); color: var(--ink); font: 400 15px/22px var(--sans); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
a { color: var(--accent); text-underline-offset: 3px; text-decoration-thickness: 1px; transition: color .16s var(--ease); }
a:hover { color: var(--accent-ink); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; text-wrap: pretty; }
ul, ol, dl, dd { margin: 0; padding: 0; }
ul, ol { list-style: none; }
button, input { font: inherit; color: inherit; }
button, a, summary, input { touch-action: manipulation; }
.vh { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.mono { font-family: var(--mono); }
.num, .money, .tnum { font-variant-numeric: tabular-nums; }
.money .sym { font-size: .8em; font-weight: 500; color: var(--muted); }
code { font-family: var(--mono); font-size: .92em; }
svg { flex: none; }
.skip { position: fixed; left: 12px; top: 12px; z-index: 100; padding: 10px 14px; background: var(--ink); color: #fff; border-radius: var(--r-md); transform: translateY(-200%); }
.skip:focus { transform: none; color: #fff; }

/* ---------- shell ---------- */
.side { position: fixed; inset: 0 auto 0 0; width: var(--side); background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; z-index: 20; }
.brand { height: 64px; display: flex; align-items: center; gap: 10px; padding: 0 20px; font-weight: 600; font-size: 16px; letter-spacing: -.01em; color: var(--ink); text-decoration: none; }
.acctrow { display: flex; align-items: center; gap: 2px; padding: 0 8px 12px 20px; margin-bottom: 8px; border-bottom: 1px solid var(--line); min-height: 44px; }
.acctrow .mono { font-size: 12px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; }
.navlist { display: grid; gap: 4px; padding: 12px 12px; }
.nv { position: relative; display: flex; align-items: center; gap: 12px; height: var(--nav-h); padding: 0 12px; border-radius: 8px; color: var(--ink-2); text-decoration: none; font-weight: 500; font-size: 14px; transition: background-color .16s var(--ease), color .16s var(--ease); }
.nv:hover { background: var(--sunken); color: var(--ink); }
.nv[aria-current="page"] { background: var(--accent-soft); color: var(--accent-ink); }
.nv[aria-current="page"]::before { content: ""; position: absolute; left: -12px; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent); }
.nv-l { flex: 1; min-width: 0; }
.nv-b { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); font: 600 12px/20px var(--sans); text-align: center; font-variant-numeric: tabular-nums; }
.nv-b[hidden] { display: none; }
.side-foot { margin-top: auto; padding: 16px 20px 20px; border-top: 1px solid var(--line); display: grid; gap: 12px; }
.envtags { display: flex; flex-wrap: wrap; gap: 6px; }
.etag { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 4px; font: 500 12px/1 var(--sans); background: var(--warn-soft); color: var(--warn); white-space: nowrap; }
.etag.fx { background: var(--sunken); color: var(--ink-2); }
.etag.short { display: none; }
.footlinks { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; }
.content { margin-left: var(--side); min-width: 0; }
main { display: block; max-width: calc(1120px + 2 * var(--pad)); margin: 0 auto; padding: 28px var(--pad) 64px; }
.topbar, .tabbar { display: none; }

/* banners */
.demo { background: var(--warn-soft); border-bottom: 1px solid var(--warn-line); color: var(--ink); font-size: 14px; line-height: 20px; }
.demo-in { max-width: calc(1120px + 2 * var(--pad)); margin: 0 auto; padding: 12px var(--pad); display: flex; align-items: flex-start; gap: 12px; }
.demo-in p { max-width: 80ch; flex: 1; padding-top: 2px; }
.demo-in p a { color: var(--warn); font-weight: 500; margin-left: 4px; white-space: nowrap; }
.statebar { max-width: calc(1120px + 2 * var(--pad)); margin: 0 auto; padding: 16px var(--pad) 0; }
.statebar p { padding: 12px 16px; border-radius: var(--r-md); font-weight: 500; }
.statebar .t-bad { background: var(--bad-soft); color: var(--bad); border: 1px solid var(--bad-line); }
.statebar .t-warn { background: var(--warn-soft); color: var(--warn); border: 1px solid var(--warn-line); }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: var(--btn-h); padding: 8px 16px; border-radius: var(--r-md); border: 1px solid transparent; font: 500 14px/1.2 var(--sans); cursor: pointer; text-decoration: none; transition: background-color .16s var(--ease), border-color .16s var(--ease), color .16s var(--ease), transform .12s var(--ease); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn-primary { background: var(--btn-primary-bg); color: var(--on-ink); }
.btn-primary:hover:not(:disabled) { background: var(--btn-primary-hover); color: #fff; }
.btn-secondary { background: var(--surface); color: var(--ink); border-color: var(--line-strong); }
.btn-secondary:hover:not(:disabled) { border-color: var(--ink-2); background: var(--sunken); color: var(--ink); }
.btn-ghost { background: transparent; color: var(--ink-2); padding: 8px 12px; }
.btn-ghost:hover:not(:disabled) { background: var(--sunken); color: var(--ink); }
.btn:disabled { cursor: not-allowed; opacity: .55; }
.iconbtn { display: inline-grid; place-items: center; width: 44px; height: 44px; border: 0; border-radius: var(--r-md); background: transparent; color: var(--ink-2); cursor: pointer; transition: background-color .16s var(--ease), color .16s var(--ease); }
.iconbtn:hover { background: var(--sunken); color: var(--ink); }
.copy { display: inline-grid; place-items: center; width: 44px; height: 44px; margin: -12px -10px -12px -8px; border: 0; background: transparent; color: var(--muted); cursor: pointer; border-radius: 8px; vertical-align: middle; transition: color .16s var(--ease), background-color .16s var(--ease); }
.copy:hover { color: var(--ink); background: var(--sunken); }
.spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgba(255,255,255,.35); border-top-color: #fff; }
@media (prefers-reduced-motion: no-preference) { .spin { animation: rot .8s linear infinite; } }
@keyframes rot { to { transform: rotate(360deg); } }

/* ---------- page header ---------- */
.ph { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 12px 24px; margin-bottom: 24px; }
.ph-t { min-width: 0; flex: 1 1 320px; }
[tabindex="-1"]:focus-visible { outline-offset: 4px; border-radius: 4px; }
.ph h1 { width: fit-content; max-width: 100%; font-size: 24px; line-height: 30px; font-weight: 600; letter-spacing: -.015em; display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; }
.ph-d { margin-top: 4px; font-size: 14px; line-height: 20px; color: var(--muted); max-width: 75ch; }
.ph-r { display: flex; align-items: center; gap: 4px; color: var(--muted); font-size: 13px; }
.ph-r .btn-ghost { min-height: 36px; font-size: 14px; padding: 6px 10px; }

/* ---------- layout ---------- */
.g12 { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 24px; }
.s7 { grid-column: span 7; }
.panel.pl { align-self: start; } .s5 { grid-column: span 5; } .s12 { grid-column: 1 / -1; }
.stack { display: grid; gap: 24px; }
.stack > *, .g12 > * { min-width: 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); min-width: 0; }
.panel-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px 16px; flex-wrap: wrap; padding: 20px 24px 0; }
.panel-h h2, .h2 { font-size: 17px; line-height: 24px; font-weight: 600; letter-spacing: -.01em; }
.panel-b { padding: 16px 24px 20px; }
.more { font-size: 14px; font-weight: 500; text-decoration: none; white-space: nowrap; }
.more:hover { text-decoration: underline; }
.chev { display: inline-block; margin-left: 4px; }
.muted { color: var(--muted); }
.sm { font-size: 13px; line-height: 18px; }
.empty { padding: 20px 24px 24px; color: var(--ink-2); max-width: 65ch; }
.empty h2, .empty h3 { font-size: 17px; line-height: 24px; color: var(--ink); margin-bottom: 4px; }
.empty a { display: inline-block; margin-top: 10px; font-weight: 500; }

/* ---------- pills, badges, tags ---------- */
.pill, .badge { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 6px; border: 1px solid; font: 500 12px/1 var(--sans); white-space: nowrap; flex: none; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.t-quiet::before { display: none; }
.t-bad { background: var(--bad-soft); color: var(--bad); border-color: var(--bad-line); }
.t-warn { background: var(--warn-soft); color: var(--warn); border-color: var(--warn-line); }
.t-neutral { background: var(--sunken); color: var(--ink-2); border-color: var(--line); }
.t-accent { background: var(--accent-soft); color: var(--accent-ink); border-color: var(--accent-line); }
.t-quiet { background: var(--surface); color: var(--muted); border-color: var(--line-2); }
.badges { display: flex; flex-wrap: wrap; gap: 4px; }
.tag { display: inline-block; flex: none; font: 500 12px/16px var(--sans); background: var(--sunken); color: var(--muted); border-radius: 4px; padding: 1px 6px; white-space: nowrap; }
.tag.warn { background: var(--warn-soft); color: var(--warn); }
.tag.acc { background: var(--accent-soft); color: var(--accent-ink); }
.tag.bad { background: var(--bad-soft); color: var(--bad); }
.tag.ink { background: var(--sunken); color: var(--ink-2); }
.rotag { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 8px; border-radius: 4px; background: var(--sunken); color: var(--ink-2); font: 500 12px/1 var(--sans); letter-spacing: 0; }

/* ---------- hero ---------- */
.hero { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); box-shadow: var(--lift); }
.hero-l { grid-column: span 7; padding: 32px; min-width: 0; min-height: 300px; }
.hero-l > [data-sec] { height: 100%; display: flex; flex-direction: column; }
.hero-l .bar { margin-top: 32px; }
.hero-l .calc { margin-top: auto; padding-top: 24px; }
.hero-r { grid-column: span 5; border-left: 1px solid var(--line); min-width: 0; display: grid; grid-template-rows: repeat(3, auto); }
.hl-label { font-size: 14px; line-height: 20px; font-weight: 500; color: var(--ink-2); }
.hl-val { margin-top: 6px; font-size: 48px; line-height: 52px; font-weight: 600; letter-spacing: -.025em; color: var(--accent-ink); font-variant-numeric: tabular-nums; }
.hl-val.neg { color: var(--bad); }
.hl-val .u { font-size: 20px; font-weight: 500; letter-spacing: 0; color: var(--muted); }
.hl-sub { margin-top: 4px; font-size: 15px; color: var(--muted); }
.bar { display: flex; gap: 2px; height: 14px; margin-top: 20px; }
.bar.over { outline: 2px solid var(--bad); outline-offset: 2px; border-radius: var(--r-sm); }
.seg { min-width: 4px; height: 100%; transform-origin: left center; }
.seg:first-child { border-radius: var(--r-sm) 0 0 var(--r-sm); }
.seg:last-child { border-radius: 0 var(--r-sm) var(--r-sm) 0; }
.seg:only-child { border-radius: var(--r-sm); }
.seg.paid { background: var(--seg-paid); } .seg.res { background: var(--seg-reserved); } .seg.spend { background: var(--seg-spendable); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 20px; margin-top: 12px; font-size: 13px; line-height: 18px; }
.legend li { display: inline-flex; align-items: center; gap: 6px; }
.legend .sw { width: 10px; height: 10px; border-radius: 2px; }
.legend .lv { font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
.legend .ll { color: var(--muted); }
@media (prefers-reduced-motion: no-preference) {
  .bar.grow .seg { animation: grow .6s var(--ease) both; }
  .bar.grow .seg:nth-child(2) { animation-delay: 60ms; }
  .bar.grow .seg:nth-child(3) { animation-delay: 120ms; }
  .legend.grow .lv { animation: fade .3s var(--ease) .2s both; }
}
@keyframes grow { from { transform: scaleX(0); } to { transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
details > summary { cursor: pointer; list-style: none; }
details > summary::-webkit-details-marker { display: none; }
.disc > summary { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; font-size: 13px; font-weight: 500; color: var(--accent); border-radius: 4px; }
.disc > summary:hover { color: var(--accent-ink); }
.disc > summary svg { transition: transform 90ms var(--ease); }
.disc[open] > summary svg { transform: rotate(90deg); }
.calc { margin-top: 16px; }
.calc dl { margin-top: 8px; display: grid; gap: 10px; }
.calc dl > div { display: grid; gap: 2px; padding-top: 10px; border-top: 1px solid var(--line); }
.calc dt { font-size: 13px; font-weight: 600; display: flex; justify-content: space-between; gap: 12px; }
.calc dd { font-size: 13px; line-height: 18px; color: var(--ink-2); }
.calc .f { font: 12px/17px var(--mono); color: var(--muted); overflow-wrap: anywhere; }
.calc .close { margin-top: 12px; font-size: 13px; color: var(--muted); }

/* metric rows */
.metric { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-content: start; column-gap: 12px; padding: 20px 24px; color: inherit; text-decoration: none; border-top: 1px solid var(--line); min-width: 0; }
.metric:first-child { border-top: 0; }
.metric > * { grid-column: 1; min-width: 0; }
.metric .m-l { font-size: 13px; line-height: 18px; font-weight: 500; color: var(--ink-2); }
.metric .m-v { margin-top: 2px; font-size: 32px; line-height: 38px; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.metric .m-v.smv { font-size: 20px; line-height: 28px; letter-spacing: -.01em; }
.metric .m-v .u { font-size: 15px; font-weight: 500; letter-spacing: 0; color: var(--muted); }
.metric .m-c { font-size: 13px; line-height: 18px; color: var(--muted); margin-top: 2px; }
.metric .m-c.warn { color: var(--warn); } .metric .m-c.bad { color: var(--bad); }
.metric .m-go { grid-column: 2; grid-row: 1 / span 4; align-self: center; color: var(--muted); display: inline-flex; align-items: center; font-size: 14px; font-weight: 500; }
.metric .m-go a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 4px; }
a.metric { transition: background-color .16s var(--ease); }
a.metric:hover { background: var(--sunken); color: inherit; }
a.metric:last-child { border-radius: 0 0 var(--r-lg) 0; }
a.metric:focus-visible { outline-offset: -2px; }

/* ---------- approval card ---------- */
.queue { display: grid; gap: 12px; max-width: 760px; }
.acard { position: relative; container-type: inline-size; background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--line-2); border-radius: var(--r-md); padding: 20px; min-width: 0; }
.acard.tone-bad { border-left-color: var(--bad); } .acard.tone-warn { border-left-color: var(--warn); }
.ac-1 { display: flex; align-items: center; gap: 8px; min-width: 0; }
.ac-name { font-size: 17px; line-height: 24px; font-weight: 600; letter-spacing: -.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.ac-amt { margin-left: auto; padding-left: 12px; font-size: 17px; font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
.ac-head { margin-top: 8px; color: var(--ink-2); }
.cmp { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 8px; align-items: center; margin-top: 16px; }
.box { background: var(--sunken); border: 1px solid transparent; border-radius: var(--r-sm); padding: 12px 16px; min-width: 0; align-self: stretch; }
.box.prop { border-color: var(--bad-line-2); }
.box-t { font-size: 12px; line-height: 18px; font-weight: 500; color: var(--ink-2); }
.box.prop .box-t { color: var(--bad); }
.box-v { margin-top: 4px; font: 14px/20px var(--mono); overflow-wrap: anywhere; color: var(--ink); }
.box-c { font-size: 12px; color: var(--muted); }
.neq { font-size: 16px; color: var(--muted); }
@container (max-width: 560px) { .cmp { grid-template-columns: minmax(0, 1fr); } .neq { display: none; } }
@media (max-width: 559px) { .cmp { grid-template-columns: minmax(0, 1fr); } .neq { display: none; } }
.facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 8px 16px; margin-top: 16px; }
.facts dt { font-size: 13px; line-height: 20px; color: var(--muted); }
.facts dd { font-size: 14px; line-height: 20px; min-width: 0; overflow-wrap: anywhere; }
.facts .mono { font-size: 13px; }

async function api(path, body) {
  const headers = { "x-takara-token": TOKEN };
  const init = { headers, cache: "no-store" };
  if (body !== undefined) { headers["content-type"] = "application/json"; init.method = "POST"; init.body = JSON.stringify(body); }
  // signing waits for finality, so it gets longer than reads
  if (typeof AbortSignal !== "undefined" && AbortSignal.timeout) init.signal = AbortSignal.timeout(path === "/api/policy/sign" ? 180000 : 60000);
  let r;
  try { r = await fetch(path, init); }
  catch (err) {
    const timedOut = err && (err.name === "TimeoutError" || err.name === "AbortError");
    const e = new Error(timedOut ? "The server didn't answer within a minute. NEAR testnet may be slow; try again." : "The request didn't reach the server. Check your connection and try again.");
    e.status = 0; throw e;
  }
  let j = null; try { j = await r.json(); } catch { /* not JSON */ }
  if (!r.ok) { const e = new Error((j && j.error) || `The server answered with status ${r.status}.`); e.status = r.status; throw e; }
  return j;
}

async function load(k, { quiet = false } = {}) {
  const had = S[k].data != null;
  S[k].status = had ? "refreshing" : "loading"; S[k].error = null;
  if (!had) refreshSections(k);
  try {
    try { S[k].data = await api(EP[k]); }
    catch (first) {
      // parallel loads can trip the public RPC's rate limit: retry a server or network failure once
      if (!(first.status === 0 || first.status >= 500) || /within a minute/.test(first.message)) throw first;
      await new Promise((ok) => setTimeout(ok, 900 + Math.random() * 900));
      S[k].data = await api(EP[k]);
    }
    S[k].status = "ok";
  } catch (e) {
    if (had) { S[k].status = "ok"; if (!quiet) toast(`Refresh failed: ${e.message}`); }
    else { S[k].status = "error"; S[k].error = e; }
  }
  M = null;
  onData(k);
}

function decisionsList() {

function cleanName(c) {

function model() {

const dueSort = (a, b) => (a.due == null) - (b.due == null) || (a.due || 0) - (b.due || 0) || b.amount - a.amount;

/* ---------- prevention counter ---------- */
const CATS = [
  ["dest", "Payout changes frozen", "frozen"],
  ["inject", "Hidden instructions ignored", "ignored"],
  ["dup", "Duplicate invoices rejected", "duplicate"],
  ["reserve", "Reserve breaches blocked", "blocked"],
  ["replay", "Replayed or altered payments refused", "refused"],
  ["scope", "Out-of-scope agent actions refused", "out of scope"],
];
const SCOPE_CODES = ["E_NOT_POLICY_SIGNER", "E_NOT_OWNER", "E_AGENT_REVOKED", "E_NOT_AGENT"];
function failCode(f) {
  if (f == null) return null;
  const s = typeof f === "string" ? f : JSON.stringify(f);
  if (/Method new is private/.test(s)) return "PRIVATE_NEW";
  const m = s.match(/E_[A-Z_]+/); return m ? m[0] : null;
}
function computeCaught(m) {
  const keys = new Map(); // key -> cat
  const decKeys = new Set();
  const add = (k, cat, fromDec) => { keys.set(k, cat); if (fromDec) decKeys.add(k); };
  for (const d of m.decs) {
    const v = d.value;
    if (d.ok === false) {
      const code = failCode(d.failure);
      if (code && (SCOPE_CODES.includes(code) || code === "PRIVATE_NEW")) add(`scope:${d.method}:${code}`, "scope", true);
    } else if (v && typeof v === "object" && v.reason) {
      const cid = v.commitment_id;
      if (v.reason === "vendor_destination_mismatch") add(`dest:${cid}`, "dest", true);
      else if (v.reason === "duplicate_evidence") add(`dup:${v.original}`, "dup", true);
      else if (v.reason === "would_break_commitments" || v.reason === "below_min_runway") add(`reserve:${cid}`, "reserve", true);
      else if (v.reason === "nonce_used" || v.reason === "authorization_mismatch") add(`${v.reason}:${cid}`, "replay", true);
    }
    for (const e of d.events || []) if (e.event === "commitment_claimed" && e.data && e.data[0] && (Number(e.data[0].flags) & 4)) add(`inject:${e.data[0].commitment_id}`, "inject", true);
  }
  const flagOnly = [];
  for (const b of m.bills) {
    if (b.flags.dest) { const k = `dest:${b.sid}`; if (!keys.has(k)) flagOnly.push({ key: k, b, cat: "dest" }); add(k, "dest"); }
    if (b.flags.inject) { const k = `inject:${b.sid}`; if (!keys.has(k)) flagOnly.push({ key: k, b, cat: "inject" }); add(k, "inject"); }
  }
  const counts = {}; CATS.forEach(([c]) => (counts[c] = 0));
  for (const cat of keys.values()) counts[cat]++;
  return { total: keys.size, counts, flagOnly };
}

let SECTIONS = [];
function sec(id, deps, opt, render, skel, label) {
  SECTIONS.push({ id, deps, opt: opt || [], render, skel, label: label || "Loading…" });
  return h`<div data-sec="${id}"></div>`;
}
function fillSection(s) {
  const el = $(`[data-sec="${s.id}"]`); if (!el) return;
  const all = [...s.deps, ...s.opt];
  const err = s.deps.find((k) => S[k].status === "error");
  const loading = all.some((k) => S[k].status === "loading" || S[k].status === "idle");
  if (err) { el.removeAttribute("aria-busy"); el.innerHTML = part(errBlock(err)); return; }
  if (loading) { el.setAttribute("aria-busy", "true"); el.innerHTML = part(s.skel ? s.skel() : skRows()) + `<span class="vh">${esc(s.label)}</span>`; return; }
  el.removeAttribute("aria-busy");
  const open = new Set($$("details[open][data-k]", el).map((d) => d.dataset.k));
  const keep = keepInputs(el);
  el.innerHTML = part(s.render());
  keep();
  open.forEach((k) => { const d = $(`details[data-k="${CSS.escape(k)}"]`, el); if (d) d.open = true; });
  $$(".filters", el).forEach((f) => { // keep the active filter visible inside its own scroller
    const a = $('[aria-current="true"]', f);
    if (a && a.offsetLeft + a.offsetWidth > f.clientWidth - 24) f.scrollLeft = a.offsetLeft - 24;
  });
}
// Re-rendering a section must not wipe what someone typed (owner control fields, the destination tick box).
function keepInputs(root) {
  const vals = $$("input[id].ocinp", root).map((i) => [i.id, i.value]);
  const focused = document.activeElement && root.contains(document.activeElement) && document.activeElement.id;
  return () => { for (const [id, v] of vals) { const i = document.getElementById(id); if (i) i.value = v; } if (focused) { const f = document.getElementById(focused); if (f) f.focus(); } };
}
function refreshSections(k) { SECTIONS.filter((s) => s.deps.includes(k) || s.opt.includes(k)).forEach(fillSection); }

const SUGGEST = ["Why was the 400 payment blocked?", "What is spendable?", "Any vendor changes?", "List bills"];
VIEWS.ask = {
  title: "Ask Takara", h1: raw(`Ask Takara <span class="rotag">${part(IC.lock(13))}Read-only</span>`),
  desc: () => "Ask why something was blocked, what’s reserved, or what changed. Answers come from the ledger and link to the transaction. Takara can’t pay, approve or change anything here.",
  body: () => h`<div class="ask"><div class="chatlog" id="chatlog" role="log" aria-live="polite" aria-label="Conversation with Takara" tabindex="0"></div>
    <form class="chatform" id="chatform"><label class="vh" for="chat-q">Question for Takara</label><input id="chat-q" name="q" placeholder="Ask about a bill, a block or a figure…" autocomplete="off" enterkeyhint="send" spellcheck="false"><button class="btn btn-primary" type="submit">Ask</button></form></div>`,
  after: (r) => {
    paintChat();
    const q = r.params.get("q");
    if (q && CHAT.autoQ !== q) { CHAT.autoQ = q; history.replaceState(null, "", "#/ask"); if (cur) cur.key = "ask?"; ask(q); }
  },
};
const REASON_LABEL = Object.fromEntries(Object.entries(REASONS).map(([k, v]) => [k, v.label]));
function fmtAnswer(text) {
  let s = esc(text);
  s = s.replace(/`([^`]+)`/g, (mm, code) => (REASON_LABEL[code] ? `<abbr title="${code}">${esc(REASON_LABEL[code])}</abbr>` : `<code translate="no">${code}</code>`));
  s = s.replace(/\d{4}-\d{2}-\d{2}T[\d:.]+Z/g, (iso) => { const t = Date.parse(iso); return Number.isFinite(t) ? part(timeEl(t, fmtDateTime(t))) : iso; });
  const m = model();
  s = s.replace(/new:[0-9a-f]{6,}/g, (id) => { const b = m && m.bills.find((x) => x.vid === id); return b ? part(nameHTML(b)) : "New vendor"; });
  return s;
}
function paintChat() {
  const log = $("#chatlog"); if (!log) return;
  const parts = [h`<div class="msg a chat-hello">Ask about a bill, a block or a figure. Takara can’t pay, approve or change anything here.</div>`];
  for (const msg of CHAT.msgs) {
    if (msg.role === "q") parts.push(h`<div class="msg q">${msg.text}</div>`);
    else if (msg.pending) parts.push(h`<div class="msg a pending">Reading the ledger…</div>`);
    else if (msg.error) parts.push(h`<div class="msg a err">Takara couldn’t answer: ${msg.error.replace(/\.$/, "")}. Try again.</div>`);
    else { const src = (msg.data.sources || []).filter((x) => x.url); parts.push(h`<div class="msg a">${raw(fmtAnswer(msg.data.answer || ""))}${src.map((x) => h`<span class="src">${ext(x.url, "View transaction")}</span>`)}</div>`); }
  }
  if (!CHAT.msgs.length) parts.push(h`<div class="chips" role="group" aria-label="Suggested questions">${SUGGEST.map((q) => h`<button class="chip" type="button" data-act="chip" data-q="${q}">${q}</button>`)}</div>`);
  log.innerHTML = part(join(parts, ""));
  log.scrollTop = log.scrollHeight;
}
async function ask(q) {
  q = String(q).trim(); if (!q || CHAT.busy) return;
  CHAT.busy = true;
  CHAT.msgs.push({ role: "q", text: q }); const a = { role: "a", pending: true }; CHAT.msgs.push(a); paintChat();
  try { a.data = await api("/api/chat", { q }); } catch (e) { a.error = e.message; }
  a.pending = false; CHAT.busy = false; paintChat();
}

function billDrawer(id) {
  const loading = ["report", "public", "policy", "decisions"].some((k) => S[k].status === "loading" || S[k].status === "idle");

  if (!m) return S.report.status === "error" ? h`<div class="dr-h"><h2 id="dr-title" tabindex="-1">Bill #${id}</h2></div><div class="dr-sec">${errBlock("report")}</div>` : h`<div class="dr-h" aria-busy="true"><h2 id="dr-title" tabindex="-1"><span class="vh">Loading bill details…</span>${skBar("60%", 20)}</h2>${skBar("120px", 26, "margin-top:12px")}</div>${skRows(5, 44)}`;

  const w = b.waitsOn;
  const issues = ISSUES.filter(([k]) => b.flags[k]);

  const acts = activityItems(m).filter((i) => i.cid != null && String(i.cid) === b.sid);
  const refusal = m.decs.find((d) => d.value && typeof d.value === "object" && d.value.ok === false && d.value.reason && String(d.value.commitment_id) === b.sid);
  const vend = vendorGroups(m).find((v) => v.vid === b.vid);

      <div class="dr-amt">${money(b.amount)}${pill(b)}</div></div>
    <section class="dr-sec" aria-labelledby="ds-tl"><h3 id="ds-tl">Progress</h3><ol class="tl">${steps.map(([t, c]) => h`<li class="${c}">${t}${c === "done" ? raw('<span class="vh"> (done)</span>') : c === "now" ? raw('<span class="vh"> (next)</span>') : ""}</li>`)}</ol>${w ? h`<p class="tl-note">Waiting on ${w.labelHTML}: ${w.task}.</p>` : ""}</section>

const sha256hex = async (s) => [...new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)))].map((b) => b.toString(16).padStart(2, "0")).join("");

  const p = d.propose; if (!p) throw new Error("there is nothing to sign");
  if (typeof d.next_pt !== "string") throw new Error("the server didn’t return the policy text");
  if (await sha256hex(d.next_pt) !== p.hash) throw new Error("the policy hash doesn’t match the policy text");
  if (await sha256hex(JSON.stringify(d.diff)) !== p.diff_hash) throw new Error("the diff hash doesn’t match the diff");
  const pub = S.public.data, cur0 = S.policy.data;
  if (!pub || p.version !== pub.policy.version + 1) throw new Error("unexpected policy version");
  const next = JSON.parse(d.next_pt);
  if (next.version !== p.version) throw new Error("the policy text has the wrong version");
  for (const k of ["max_auto_pay", "cooling_off_hours", "min_runway_days"]) {
    const want = d.diff[k] ? d.diff[k].to : undefined;
    if (want !== undefined && String(next[k]) !== String(want)) throw new Error(`the policy text disagrees with the diff on ${PLABEL[k]}`);
    if (want === undefined && cur0) { // an unedited control must keep its current value
      const have = k === "max_auto_pay" ? Number(next[k]) / 10 ** next.decimals : Number(next[k]);
      if (have !== Number(cur0[k])) throw new Error(`the policy text changes ${PLABEL[k]}, which you didn’t edit`);
    }
  }
  if (!/^[0-9a-f]{64}$/.test(p.hash) || !/^[0-9a-f]{64}$/.test(p.diff_hash) || !/^[A-Za-z0-9+/=]+$/.test(p.sealed) || p.sealed.length > 24576) throw new Error("the proposal is malformed");

}
async function signPolicyWithWallet(tryAnyway) {

  let args;
  try { args = await verifyProposal(pending.d); }
  catch (e) { pending.state = { error: `checked before signing: ${e.message}` }; return paintPolicyDialog(pending.d, pending.state); }
  if (!S.public.data || S.public.data.treasury !== TREASURY_ID) return toast("Treasury mismatch. Nothing was sent.");
  pdOpener = null; pdlg.close(); // 3.7: the wallet can't be used under a modal
  toast("Checked: the hash matches the policy text. Confirm the policy change in your wallet…");
  const r = await sendTx("propose_policy", args);
  const link = r.hash ? { href: `https://testnet.nearblocks.io/txns/${r.hash}`, text: "View transaction" } : null;
  const reopen = (state) => { pending.state = state; paintPolicyDialog(pending.d, state); pdlg.showModal(); $("#pd-title").focus(); };
  if (r.kind === "done") {

    const thr = (S.public.data && S.public.data.threshold) || 1;
    toast(thr > 1 ? `Proposal ${r.value} created: 1 of ${thr} approvals.` : `Policy v${args.version} signed and live.`, link);

}

function walletBoot() {

  if (["transactionHashes", "errorCode", "errorMessage", "account_id", "all_keys"].some((k) => q.has(k))) {
    const hash = (q.get("transactionHashes") || "").split(",")[0];
    if (hash && /^[1-9A-HJ-NP-Za-km-z]{43,44}$/.test(hash)) toast("Your wallet sent a transaction.", { href: `https://testnet.nearblocks.io/txns/${hash}`, text: "View transaction" });
    else if (q.get("errorCode")) toast(q.get("errorCode") === "userRejected" ? "You cancelled in the wallet. Nothing was sent." : "The wallet reported an error. Nothing was sent unless your wallet shows a transaction.");
    history.replaceState(null, "", location.pathname + location.hash);
    try { sessionStorage.removeItem("takara.pendingTx"); } catch { /* storage blocked */ }
  }
  let p = null; try { p = JSON.parse(sessionStorage.getItem("takara.pendingTx") || "null"); sessionStorage.removeItem("takara.pendingTx"); } catch { /* storage blocked */ }
  if (p && p.method) toast("A wallet request from this tab didn’t report back. Check your wallet’s activity.");
}

/* ================================================================== events */
document.addEventListener("click", async (e) => {
  const a = e.target.closest("a[href]");
  if (a) {
    const href = a.getAttribute("href");
    if (href.startsWith("#/") && cur && cur.view === "policy" && !href.startsWith("#/policy") && policyDirty()) {
      e.preventDefault(); confirmDiscard(() => { location.hash = href.slice(1); }); return;
    }
    if (/^#\/(bills|vendors)\/./.test(href)) opener = { key: a.dataset.open || null, el: a };
  }
  const t = e.target.closest("[data-act]"); if (!t) return;
  const act = t.dataset.act;
  if (act === "skip") { e.preventDefault(); main.focus(); main.scrollIntoView(); }
  else if (act === "refresh") loadAll(true);
  else if (act === "retry") load(t.dataset.k);
  else if (act === "copy") toast((await copyText(t.dataset.v, t)) ? "Copied" : "Couldn’t copy. Select the text and copy it manually.");
  else if (act === "dismiss-demo") { try { sessionStorage.setItem("takara.demoBanner", "dismissed"); } catch { /* storage blocked */ } paintDemo(); main.focus(); }
  else if (act === "close-drawer") requestCloseDrawer();
  else if (act === "more") { paintSheet(); moreSheet.showModal(); }
  else if (act === "close-more") moreSheet.close();
  else if (act === "chip") { ask(t.dataset.q); }
  else if (act === "cf-keep") confirmDlg.close();
  else if (act === "cf-discard") { confirmDlg.close(); PF.edits = null; const cb = confirmCb; confirmCb = null; if (cb) cb(); }
  else if (act === "preset") {
    const p = S.policy.data; PF.edits = null; PF.version = null; fillSection(SECTIONS.find((s) => s.id === "pform"));
    if (p) $("#f-max_auto_pay").focus();
  }
  else if (act === "pd-close") pdlg.close();
  else if (act === "pd-sign") signPolicy();
  else if (act === "pd-wallet") signPolicyWithWallet(false);
  else if (act === "pd-try") signPolicyWithWallet(true);
  else if (act === "wallet-connect") connectWallet();
  else if (act === "wallet-disconnect") { if (window.TW) window.TW.disconnect().catch(() => toast("Couldn’t disconnect. Try again.")); }
  else if (act === "more-wallet") { paintSheet(); moreSheet.showModal(); const f = $('.sheetwal button, .sheetwal a'); if (f) f.focus(); }
  else if (act === "tx-start") startTx(t);
  else if (act === "tx-go") runTx(t.dataset.slot);
  else if (act === "tx-cancel") { const slot = t.dataset.slot; delete TX[slot]; paintTxSlot(slot, '[data-act="tx-start"]:not([disabled])'); }
  else if (act === "goto-owner") { e.preventDefault(); if (cur && cur.view === "policy") { const oc = $("#oc-h"); if (oc) { oc.scrollIntoView({ block: "start" }); oc.setAttribute("tabindex", "-1"); oc.focus({ preventScroll: true }); } } else location.hash = "#/policy?focus=owner"; }
});
document.addEventListener("change", (e) => { const b = e.target; if (b.dataset && b.dataset.oob && TX[b.dataset.oob]) TX[b.dataset.oob].oob = b.checked; });
document.addEventListener("submit", (e) => {
  if (e.target.id === "pform") { e.preventDefault(); submitPolicy(e.target); }
  if (e.target.id === "chatform") { e.preventDefault(); const i = $("#chat-q"); const q = i.value; i.value = ""; ask(q); }
});
document.addEventListener("input", (e) => {
  const inp = e.target;
  if (inp.classList && inp.classList.contains("ocinp")) { FIELD_VALS[inp.id] = inp.value; return; }
  if (!inp.closest || !inp.closest("#pform") || !PF.edits) return;
  PF.edits[inp.name] = inp.value;
  const p = S.policy.data;
  const tag = $(`[data-edited="${inp.name}"]`); if (tag) tag.hidden = String(inp.value).trim() === String(p[inp.name]);
  const err = $(`#e-${inp.name}`); const f = PFIELDS.find((x) => x.k === inp.name);
  if (err && !err.hidden && validField(f, inp.value)) { err.hidden = true; inp.setAttribute("aria-invalid", "false"); inp.closest(".inp").classList.remove("invalid"); }
  const rb = $('[data-act="preset"]'); if (rb) rb.disabled = !policyDirty();
});
window.addEventListener("beforeunload", (e) => { if (policyDirty()) { e.preventDefault(); e.returnValue = ""; } });

/* ================================================================== boot */
$('[data-slot="envtags-top"]').innerHTML = part(envTags("top"));
$('[data-slot="envtags-side"]').innerHTML = part(envTags("side"));
$('[data-slot="footlinks"]').innerHTML = part(h`<a href="${PRODUCT}"${DEMO ? "" : raw(' target="_blank" rel="noopener"')}>Product page${DEMO ? "" : raw('<span class="vh"> (opens in a new tab)</span>')}</a><span aria-hidden="true">·</span><a href="${GITHUB}" target="_blank" rel="noopener">GitHub<span class="vh"> (opens in a new tab)</span></a>`);
paintDemo();
paintWallet();
walletBoot();
onRoute();
loadAll();
</script>

// Guard 1: drop "near-wallet-injected" messages from other windows (the library doesn't check origin).
window.addEventListener("message", (e) => {
  if (e.data && e.data.type === "near-wallet-injected" && e.source !== window) e.stopImmediatePropagation();
}, true);

// Guard 2: localStorage minus the library's persistent "debug-wallets" hook, so a one-time XSS
// can't plant a permanent fake wallet.
const storage = {
  async get(k) { if (k === "debug-wallets") return null; try { return localStorage.getItem(k); } catch { return null; } },
  async set(k, v) { if (k === "debug-wallets") return; try { localStorage.setItem(k, v); } catch { /* storage blocked */ } },
  async remove(k) { try { localStorage.removeItem(k); } catch { /* storage blocked */ } },
};

  manifest: WALLET_MANIFEST,
  features: { signAndSendTransaction: true },
  providers: { testnet: [RPC] },
  autoConnect: false,
  footerBranding: null,
  storage,
});

const state = { status: "ready", accountId: null, walletName: null };
const emit = () => window.dispatchEvent(new CustomEvent("takara:wallet", { detail: { ...state } }));
const setAccount = (accountId, walletName) => { Object.assign(state, { status: accountId ? "connected" : "ready", accountId: accountId || null, walletName: walletName || null }); emit(); };

connector.on("wallet:signIn", async (e) => {
  const w = await connector.wallet().catch(() => null);
  setAccount(e.accounts && e.accounts[0] && e.accounts[0].accountId, w && w.manifest && w.manifest.name);
});
connector.on("wallet:signOut", () => setAccount(null));

async function rpc(method, params) {
  const r = await fetch(RPC, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ jsonrpc: "2.0", id: 1, method, params }) });
  const j = await r.json();
  if (j.error) throw Object.assign(new Error(j.error.cause ? j.error.cause.name : j.error.message), { rpc: j.error });
  return j.result;
}

const PANIC = /Smart contract panicked: ([A-Z0-9_]+)|\b(E_[A-Z_]+)\b|Method new is private/;
const B58 = /\b[1-9A-HJ-NP-Za-km-z]{43,44}\b/;
function failureOf(outcome) {
  const all = [outcome && outcome.status, ...((outcome && outcome.receipts_outcome) || []).map((r) => r.outcome && r.outcome.status)];
  const f = all.find((s) => s && s.Failure);
  return f ? JSON.stringify(f.Failure) : null;
}
function codeOf(s) { const m = String(s || "").match(PANIC); return m ? (m[1] || m[2] || "PRIVATE_NEW") : null; }

// Each wallet reports results in its own shape, so the chain is the source of truth.
async function settle(outcome, thrown, signerId, onHash) {
  if (thrown) {
    const msg = String((thrown && (thrown.message || thrown)) || "");
    const hash = (msg.match(B58) || [])[0] || null;
    const code = codeOf(msg);
    if (!hash && !code && /reject|cancel|closed|denied/i.test(msg)) return { kind: "cancelled" };
    if (!hash) return code ? { kind: "refused", code, hash: null } : { kind: "error", message: msg || "unknown wallet error" };
    outcome = { transaction: { hash } };
  }
  const hash = outcome && ((outcome.transaction && outcome.transaction.hash) || outcome.transaction_outcome && outcome.transaction_outcome.id);
  if (!hash) return { kind: "error", message: "the wallet returned no transaction" };
  if (onHash) try { onHash(hash); } catch { /* UI only */ }
  let tx;
  try { tx = await rpc("tx", { tx_hash: hash, sender_account_id: signerId, wait_until: "FINAL" }); }
  catch { return { kind: "submitted", hash }; }
  const failure = failureOf(tx);
  if (failure) return { kind: "refused", code: codeOf(failure) || "TX_FAILED", hash, raw: failure };
  const logs = (tx.receipts_outcome || []).flatMap((r) => (r.outcome && r.outcome.logs) || []);
  const events = logs.filter((l) => l.startsWith("EVENT_JSON:")).map((l) => { try { return JSON.parse(l.slice(11)); } catch { return null; } }).filter(Boolean);
  const recovery = events.find((e) => e.event === "recovery_completed");
  if (recovery && recovery.data && recovery.data[0] && recovery.data[0].ok === false) return { kind: "refused", code: "RECOVERY_REVERTED", hash, events };
  const sv = tx.status && tx.status.SuccessValue;
  let value = null; try { value = sv ? JSON.parse(atob(sv)) : null; } catch { /* not JSON */ }
  return { kind: "done", hash, value, events };
}

window.TW = {
  state,
  TREASURY,
  wallets: () => connector.availableWallets.map((w) => w.manifest.id),
  async connect() { return connector.connect(); }, // rejects with "User rejected" when the chooser is closed
  async disconnect() { return connector.disconnect(); },
  async accountExists(id) {
    try { await rpc("query", { request_type: "view_account", finality: "final", account_id: id }); return true; }
    catch (e) { if (/UNKNOWN_ACCOUNT/.test(e.message)) return false; throw e; }
  },
  // spec comes from the page's TREASURY_ACTIONS allowlist, never from the server
  async call(method, args, spec, onHash) {
    if (!spec || typeof spec.gas !== "string" || typeof spec.deposit !== "string") return { kind: "error", message: "not an allowed action" };
    const signerId = state.accountId;
    if (!signerId) return { kind: "error", message: "no wallet connected" };
    let outcome = null, thrown = null;
    try {
      const wallet = await connector.wallet();
      outcome = await wallet.signAndSendTransaction({
        signerId, receiverId: TREASURY,
        actions: [{ type: "FunctionCall", params: { methodName: method, args, gas: spec.gas, deposit: spec.deposit } }],
      });
    } catch (e) { thrown = e; }
    return settle(outcome, thrown, signerId, onHash);
  },
  rpc,
};

connector.getConnectedWallet()
  .then(({ wallet, accounts }) => setAccount(accounts && accounts[0] && accounts[0].accountId, wallet && wallet.manifest && wallet.manifest.name))
  .catch(() => setAccount(null));
