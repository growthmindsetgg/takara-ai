[package]
name = "takara-mock-ft"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Fictional test stablecoin (tUSDC, 6 decimals) for the Takara AI testnet fixtures. No value."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"
near-contract-standards = "5.30"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
